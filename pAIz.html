<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<!-- FIX 6: removed contradictory maximum-scale=1.0 + user-scalable=yes -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- FIX 1: v5.2 → v5.3 -->
<title>pAIz v5.3 · Paiz Corp</title>
<link rel="icon" type="image/svg+xml" href="/paizcorp/paizcorp-favicon.svg">
<meta name="description" content="pAIz v5.3 — The Legend of Legiona's omniscient AI. Full ecosystem knowledge, slash commands, image preview, context memory. EN & BM.">
<meta property="og:title" content="pAIz v5.3 · Paiz® Corp">
<meta property="og:description" content="The LoL's omniscient AI — government, ISC, NIS, FN SMP, history, gallery. Ask in EN or BM.">
<meta property="og:url" content="https://faizzzlol.github.io/paizcorp/pAIz">
<meta name="theme-color" content="#0d0c0a">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════ TOKENS ═══════════════════════════ */
:root {
  --green:#2a6647;--green-lt:#3a9165;--green-dim:rgba(42,102,71,0.1);
  --bg:#0d0c0a;--bg2:#111009;--bg3:#161410;
  --surface:#1a1814;--surface2:#211f1a;
  --txt:#ede8da;--txt2:#b5ad9a;--muted:rgba(237,232,218,0.42);
  --faint:rgba(237,232,218,0.22);--xfaint:rgba(237,232,218,0.1);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.04);
  --nav-bg:#0a0908;--nav-border:rgba(255,255,255,0.06);
  --msg-user-bg:#1d2e24;--msg-user-txt:rgba(237,232,218,0.92);
  --msg-bot-txt:#ccc6b4;
  --input-bg:#181612;--input-bd:rgba(255,255,255,0.09);--input-txt:#ede8da;
  --send-bg:#2a6647;--send-hover:#338056;
  --chip-bg:#161410;--chip-bd:rgba(255,255,255,0.08);--chip-txt:rgba(237,232,218,0.38);
  --chip-hbg:rgba(42,102,71,0.12);--chip-hbd:rgba(42,102,71,0.3);--chip-htxt:rgba(237,232,218,0.8);
  --fup-bg:#111009;--fup-bd:rgba(255,255,255,0.07);--fup-txt:rgba(237,232,218,0.32);
  --scroll:#2a2720;--sn-bg:#060504;--sn-bd:rgba(255,255,255,0.04);
  --sn-txt:rgba(255,255,255,0.22);
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,0.15);
  --red:#c44;--blue:#5b9cf6;--amber:#f6a035;
  --img-border:rgba(42,102,71,0.2);
  --cmd-bg:rgba(42,102,71,0.08);
}
[data-theme="light"] {
  --bg:#f7f4ed;--bg2:#f0ece2;--bg3:#e8e3d8;
  --surface:#ffffff;--surface2:#f7f4ed;
  --txt:#161410;--txt2:#3d3a32;--muted:rgba(22,20,16,0.5);
  --faint:rgba(22,20,16,0.3);--xfaint:rgba(22,20,16,0.12);
  --border:rgba(22,20,16,0.09);--border2:rgba(22,20,16,0.05);
  --nav-bg:#ffffff;--nav-border:rgba(22,20,16,0.09);
  --msg-user-bg:#e8f2ec;--msg-user-txt:#1a3a27;
  --msg-bot-txt:#2e2b24;
  --input-bg:#ffffff;--input-bd:rgba(22,20,16,0.12);--input-txt:#161410;
  --chip-bg:#f7f4ed;--chip-bd:rgba(22,20,16,0.1);--chip-txt:rgba(22,20,16,0.42);
  --chip-hbg:rgba(42,102,71,0.08);--chip-hbd:rgba(42,102,71,0.25);--chip-htxt:#1d4a33;
  --fup-bg:#f0ece2;--fup-bd:rgba(22,20,16,0.09);--fup-txt:rgba(22,20,16,0.38);
  --scroll:#ddd8cc;--sn-bg:#060504;--sn-bd:rgba(255,255,255,0.04);
  --sn-txt:rgba(255,255,255,0.22);
  --img-border:rgba(42,102,71,0.25);
  --cmd-bg:rgba(42,102,71,0.05);
}
html.sw *,html.sw *::before,html.sw *::after{transition:background-color .25s,color .25s,border-color .25s !important}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}

/* FIX 5: Global kbd styling — covers KB responses + wsub + cmd-hint */
kbd{
  font-family:'DM Mono',monospace;
  background:var(--surface);
  border:1px solid var(--border);
  padding:1px 6px;
  border-radius:4px;
  color:#3a9165;
  font-size:.85em;
  margin:0 1px;
  white-space:nowrap;
}
[data-theme="light"] kbd{background:#f0ece2;border-color:rgba(22,20,16,.12);}

/* SUPER NAV */
.sn{background:var(--sn-bg);height:28px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--sn-bd);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.sn::-webkit-scrollbar{display:none}
.sn-label{font-family:'DM Mono',monospace;font-size:.4rem;letter-spacing:2px;color:rgba(255,255,255,.14);white-space:nowrap;margin-right:14px;flex-shrink:0}
.sn-links{display:flex}
.sn-links a{font-family:'DM Mono',monospace;font-size:.4rem;letter-spacing:1.5px;color:var(--sn-txt);text-decoration:none;padding:0 9px;height:28px;display:flex;align-items:center;border-right:1px solid var(--sn-bd);transition:color .15s;white-space:nowrap;flex-shrink:0}
.sn-links a:hover{color:rgba(255,255,255,.7)}
.sn-links a.active{color:#3a9165}
.sn-r{margin-left:auto;display:flex;align-items:center;gap:7px;padding-left:14px;flex-shrink:0}
.sn-dot{width:4px;height:4px;border-radius:50%;background:#3a9165;animation:blink 2.2s infinite}
.sn-st{font-family:'DM Mono',monospace;font-size:.38rem;letter-spacing:1.5px;color:rgba(255,255,255,.14);white-space:nowrap}

/* TOP NAV */
.tnav{background:var(--nav-bg);border-bottom:1px solid var(--nav-border);height:54px;display:flex;align-items:center;padding:0 18px;flex-shrink:0;gap:10px}
.tn-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.tn-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1a2e20,#0d0c0a);border:1px solid rgba(42,102,71,.4);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:.9rem;font-weight:900;color:#3a9165;flex-shrink:0;transition:border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.tn-logo::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(58,145,101,.15),transparent 70%)}
.tn-brand:hover .tn-logo{border-color:rgba(42,102,71,.7);box-shadow:0 0 12px rgba(42,102,71,.25)}
.tn-name{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:2px;color:var(--txt);font-weight:500}
.tn-badge{font-family:'DM Mono',monospace;font-size:.38rem;letter-spacing:1.5px;padding:2px 8px;border:1px solid rgba(42,102,71,.3);color:#3a9165;display:flex;align-items:center;gap:5px}
.tn-badge::before{content:'';width:4px;height:4px;border-radius:50%;background:#3a9165;animation:blink 2.2s infinite}
.tn-version{font-family:'DM Mono',monospace;font-size:.35rem;letter-spacing:1px;padding:2px 6px;border:1px solid rgba(201,168,76,.25);color:var(--gold)}
.tn-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.tn-lnk{font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:1.5px;color:var(--faint);text-decoration:none;padding:5px 11px;border:1px solid var(--border);transition:all .2s;white-space:nowrap}
.tn-lnk:hover{color:#3a9165;border-color:rgba(42,102,71,.3)}
.tn-lnk.pri{background:var(--bg3);color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.08)}
[data-theme="light"] .tn-lnk.pri{background:#161410;color:rgba(255,255,255,.75);border-color:#161410}
.tn-lnk.pri:hover{background:var(--green);border-color:var(--green);color:#fff}
.icon-btn{width:32px;height:32px;background:none;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:all .2s;flex-shrink:0}
.icon-btn:hover{border-color:rgba(42,102,71,.35);color:#3a9165;background:var(--green-dim)}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt-btn{font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:1.5px;color:var(--faint);background:none;border:1px solid var(--border);cursor:pointer;padding:0 10px;height:32px;transition:all .2s;white-space:nowrap}
.txt-btn:hover{color:#3a9165;border-color:rgba(42,102,71,.35)}

/* LANG + SEARCH INDICATORS */
.lang-flag{font-family:'DM Mono',monospace;font-size:.38rem;letter-spacing:1px;padding:3px 8px;border:1px solid var(--border);color:var(--faint);transition:all .2s;flex-shrink:0}
.lang-flag.bm{border-color:rgba(201,168,76,.3);color:var(--gold)}
.search-mode-indicator{font-family:'DM Mono',monospace;font-size:.38rem;letter-spacing:1px;padding:2px 8px;border:1px solid rgba(91,156,246,.3);color:#5b9cf6;display:none;flex-shrink:0;align-items:center;gap:4px}
.search-mode-indicator.show{display:flex}
.search-mode-indicator::before{content:'⌕';font-size:.5rem}

/* CHAT SHELL */
.shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.msgs-wrap{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;min-height:0}
.msgs-wrap::-webkit-scrollbar{width:4px}
.msgs-wrap::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:2px}
.msgs-inner{max-width:820px;margin:0 auto;padding:28px 20px 12px;display:flex;flex-direction:column;gap:4px}

/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:16px;min-height:calc(100vh - 28px - 54px - 106px)}
.wlogo{width:72px;height:72px;border-radius:50%;background:var(--bg3);border:1.5px solid rgba(42,102,71,.3);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:#3a9165;position:relative;overflow:hidden}
.wlogo::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 35%,rgba(58,145,101,.12),transparent 70%)}
.wtitle{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:900;letter-spacing:-.5px;color:var(--txt);line-height:1.15}
.wtitle em{font-style:italic;color:#3a9165;font-weight:400}
.wsub{font-size:.88rem;color:var(--muted);font-weight:300;max-width:480px;line-height:1.85}
.wbm{font-size:.78rem;color:var(--faint);font-weight:300;font-style:italic}
.wnew{font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:1.5px;padding:4px 12px;border:1px solid rgba(42,102,71,.35);color:#3a9165;background:rgba(42,102,71,.06);display:inline-flex;align-items:center;gap:6px}
.wnew-dot{width:5px;height:5px;border-radius:50%;background:#3a9165;animation:blink 1.5s infinite}

/* CATEGORY TABS */
.wcat{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.wcat-btn{font-family:'DM Mono',monospace;font-size:.38rem;letter-spacing:1.5px;padding:4px 10px;border:1px solid var(--border);color:var(--faint);cursor:pointer;background:none;transition:all .18s}
.wcat-btn:hover,.wcat-btn.on{border-color:rgba(42,102,71,.35);color:#3a9165;background:var(--green-dim)}
.wcat-btn.img-cat{border-color:rgba(201,168,76,.2);color:var(--gold)}
.wcat-btn.img-cat.on,.wcat-btn.img-cat:hover{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.4);color:var(--gold)}
/* FIX 2: NIS tab — purple/civic tone to distinguish from gov/images */
.wcat-btn.nis-cat{border-color:rgba(91,156,246,.2);color:var(--blue)}
.wcat-btn.nis-cat.on,.wcat-btn.nis-cat:hover{background:rgba(91,156,246,.07);border-color:rgba(91,156,246,.4);color:var(--blue)}

.wchips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:680px;margin-top:4px}
.chip{background:var(--chip-bg);border:1px solid var(--chip-bd);padding:8px 14px;font-family:'Outfit',sans-serif;font-size:.82rem;color:var(--chip-txt);cursor:pointer;transition:all .18s;border-radius:8px;text-align:left;line-height:1.3}
.chip:hover{background:var(--chip-hbg);border-color:var(--chip-hbd);color:var(--chip-htxt)}
.chip.img-chip{border-color:rgba(201,168,76,.15);font-size:.78rem}
.chip.img-chip:hover{background:rgba(201,168,76,.08);border-color:rgba(201,168,60,.35);color:var(--gold)}
.chip.nis-chip{border-color:rgba(91,156,246,.15);font-size:.78rem}
.chip.nis-chip:hover{background:rgba(91,156,246,.07);border-color:rgba(91,156,246,.35);color:var(--blue)}

/* COMMAND HINT BAR */
.cmd-hint-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.cmd-hint{font-family:'DM Mono',monospace;font-size:.35rem;letter-spacing:1px;color:var(--xfaint);background:var(--cmd-bg);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}

/* MSG GROUPS */
.mg{display:flex;flex-direction:column;gap:2px;animation:mi .2s ease;margin-bottom:6px}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mu{align-self:flex-end;background:var(--msg-user-bg);color:var(--msg-user-txt);padding:11px 16px;border-radius:18px 18px 4px 18px;max-width:72%;font-size:.9rem;line-height:1.65}
.mb-row{display:flex;gap:12px;align-items:flex-start;max-width:100%}
.mb-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--bg3);border:1px solid rgba(42,102,71,.25);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:.7rem;font-weight:900;color:#3a9165;margin-top:3px}
.mb-txt{flex:1;min-width:0;font-size:.9rem;line-height:1.8;color:var(--msg-bot-txt);padding-top:3px}
.mb-txt a{color:#3a9165;text-decoration:none;border-bottom:1px solid rgba(58,145,101,.28);transition:border-color .15s}
.mb-txt a:hover{border-bottom-color:#3a9165}
.mb-txt strong{color:var(--txt);font-weight:600}
.mb-txt em{color:var(--gold);font-style:italic}
[data-theme="light"] .mb-txt strong{color:#161410}
.mb-txt .tag{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:1px;padding:1px 6px;border:1px solid rgba(42,102,71,.25);color:#3a9165;border-radius:3px;display:inline-block;margin:0 2px}
.mb-txt .tag.gold{border-color:rgba(201,168,76,.3);color:var(--gold)}
.mb-txt .tag.red{border-color:rgba(196,68,68,.3);color:var(--red)}
.mb-txt .tag.blue{border-color:rgba(91,156,246,.3);color:var(--blue)}
.mb-txt .tag.new{border-color:rgba(42,102,71,.4);color:#3a9165;background:rgba(42,102,71,.08)}
.mb-txt .list-item{display:block;padding:3px 0 3px 12px;border-left:2px solid rgba(42,102,71,.25);margin:3px 0;font-size:.88rem}
.mtime{font-family:'DM Mono',monospace;font-size:.35rem;letter-spacing:.8px;color:var(--xfaint);margin-top:3px}
.mtime.bot{padding-left:40px}

/* IMAGE GRID */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;margin-top:10px;border-radius:4px;overflow:hidden}
.img-grid.single{grid-template-columns:1fr}
.img-grid.duo{grid-template-columns:1fr 1fr}
.img-grid.trio{grid-template-columns:1fr 1fr 1fr}
.paiz-img{width:100%;aspect-ratio:16/10;object-fit:cover;cursor:pointer;border:0;transition:transform .25s,opacity .2s,box-shadow .25s;display:block;background:var(--bg3)}
.paiz-img:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(42,102,71,.35);z-index:2;position:relative}
.img-grid.single .paiz-img{max-height:260px;aspect-ratio:auto;object-fit:cover}
.img-caption{font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:1.5px;color:var(--xfaint);margin-top:6px;display:flex;align-items:center;gap:8px}
.img-caption::before{content:'';width:12px;height:1px;background:rgba(42,102,71,.4)}
.img-caption.gold-cap{color:rgba(201,168,76,.5)}
.img-caption.gold-cap::before{background:rgba(201,168,76,.4)}

/* SEARCH RESULTS */
.search-results{margin-top:10px;display:flex;flex-direction:column;gap:3px}
.sr-item{background:var(--surface);border:1px solid var(--border);padding:10px 14px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:all .2s;color:var(--txt)}
.sr-item:hover{border-color:rgba(42,102,71,.3);background:var(--surface2)}
.sr-tag{font-family:'DM Mono',monospace;font-size:.38rem;letter-spacing:1.5px;color:#3a9165;opacity:.7;display:block;margin-bottom:3px}
.sr-name{font-size:.85rem;color:var(--txt);font-weight:500;display:block}
.sr-desc{font-size:.75rem;color:var(--muted);font-weight:300;display:block;margin-top:2px}
.sr-arrow{font-family:'DM Mono',monospace;font-size:.5rem;color:rgba(42,102,71,.5);flex-shrink:0;transition:color .2s}
.sr-item:hover .sr-arrow{color:#3a9165}

/* LIGHTBOX */
#lb{position:fixed;inset:0;z-index:99999;background:rgba(4,5,4,.97);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s ease}
#lb.open{opacity:1;pointer-events:auto}
.lb-inner{max-width:1080px;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
#lb-img{max-width:100%;max-height:82vh;object-fit:contain;display:block;border:1px solid rgba(42,102,71,.2);animation:lbIn .25s ease}
@keyframes lbIn{from{transform:scale(.96)}to{transform:scale(1)}}
.lb-meta{width:100%;padding:14px 0 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.lb-title{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:2px;color:#3a9165}
.lb-info{font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:1px;color:var(--faint)}
.lb-close{position:absolute;top:-44px;right:0;font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:2px;color:var(--faint);background:none;border:1px solid var(--border);cursor:pointer;padding:6px 14px;transition:all .2s}
.lb-close:hover{color:var(--txt);border-color:rgba(255,255,255,.25)}
.lb-nav{display:flex;gap:8px;margin-top:12px}
.lb-nav-btn{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:1.5px;color:var(--faint);background:none;border:1px solid var(--border);cursor:pointer;padding:6px 14px;transition:all .2s}
.lb-nav-btn:hover:not(:disabled){color:#3a9165;border-color:rgba(42,102,71,.35)}
.lb-nav-btn:disabled{opacity:.2;cursor:default}
.lb-counter{font-family:'DM Mono',monospace;font-size:.45rem;letter-spacing:2px;color:var(--faint);align-self:center}

/* TYPING */
.typing-row{display:flex;gap:12px;align-items:flex-start;animation:mi .2s ease}
.typing-bub{padding:10px 6px;display:flex;gap:5px;align-items:center}
.td{width:6px;height:6px;border-radius:50%;background:#3a9165;opacity:.4;animation:td 1.3s infinite ease-in-out}
.td:nth-child(2){animation-delay:.15s}
.td:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:.9}}

/* FOLLOW-UPS */
.fups{display:flex;gap:6px;flex-wrap:wrap;padding-left:40px;margin-top:10px}
.fup{background:var(--fup-bg);border:1px solid var(--fup-bd);padding:5px 11px;border-radius:20px;font-family:'DM Mono',monospace;font-size:.4rem;letter-spacing:1px;color:var(--fup-txt);cursor:pointer;transition:all .18s}
.fup:hover{background:var(--chip-hbg);border-color:var(--chip-hbd);color:var(--chip-htxt)}

/* INPUT */
.input-area{flex-shrink:0;padding:12px 20px 16px;background:var(--bg)}
.input-wrap{max-width:800px;margin:0 auto;background:var(--input-bg);border:1px solid var(--input-bd);border-radius:14px;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 16px;transition:border-color .2s,box-shadow .2s}
.input-wrap:focus-within{border-color:rgba(42,102,71,.42);box-shadow:0 0 0 3px rgba(42,102,71,.07)}
#ci{flex:1;background:none;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:.95rem;color:var(--input-txt);line-height:1.6;resize:none;min-height:26px;max-height:180px;overflow-y:auto;padding:0}
#ci::placeholder{color:var(--faint)}

<script src="/paizcorp/assets/js/pAIz-engine.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   pAIz v5.3 — UI SHELL
   KB / scoring / imgGrid / BM detection → PaizEngine.*
   This file: theme · lightbox · chips · chat DOM · processQuery
═══════════════════════════════════════════════════════════════ */

/* ── THEME ── */
let theme = localStorage.getItem('paiz-theme') || 'dark';
document.documentElement.setAttribute('data-theme', theme);
setIcon();

function toggleTheme() {
  const h = document.documentElement;
  h.classList.add('sw');
  theme = theme === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', theme);
  localStorage.setItem('paiz-theme', theme);
  setIcon();
  setTimeout(() => h.classList.remove('sw'), 300);
}

function setIcon() {
  const b = document.getElementById('tbtn');
  if (!b) return;
  b.innerHTML = theme === 'dark'
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  b.title = theme === 'dark' ? 'Light mode' : 'Dark mode';
}

/* ── LIGHTBOX ── */
let lbImages = [], lbIndex = 0;

function lbOpen(images, idx = 0) {
  lbImages = Array.isArray(images) ? images : [images];
  lbIndex  = idx;
  lbRender();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function lbRender() {
  const img = document.getElementById('lb-img');
  img.style.opacity = '0';
  img.src = lbImages[lbIndex];
  img.onload = () => { img.style.opacity = '1'; img.style.transition = 'opacity .2s'; };
  document.getElementById('lb-title').textContent = `IMAGE ${lbIndex + 1} / ${lbImages.length}`;
  document.getElementById('lb-info').textContent  = 'PAIZ® CORP · THE LOL NETWORK';
  const nav = document.getElementById('lb-nav');
  if (lbImages.length > 1) {
    nav.style.display = 'flex';
    document.getElementById('lb-counter').textContent  = `${lbIndex + 1} / ${lbImages.length}`;
    document.getElementById('lb-prev').disabled = lbIndex === 0;
    document.getElementById('lb-next').disabled = lbIndex === lbImages.length - 1;
  } else {
    nav.style.display = 'none';
  }
}

function lbStep(d) {
  lbIndex = Math.max(0, Math.min(lbImages.length - 1, lbIndex + d));
  lbRender();
}

function lbClose() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lb').addEventListener('click', e => {
  if (e.target === document.getElementById('lb')) lbClose();
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape')     lbClose();
  if (e.key === 'ArrowLeft')  lbStep(-1);
  if (e.key === 'ArrowRight') lbStep(1);
});

let lbTx = 0;
document.getElementById('lb').addEventListener('touchstart', e => { lbTx = e.touches[0].clientX; }, { passive: true });
document.getElementById('lb').addEventListener('touchend',   e => {
  const d = lbTx - e.changedTouches[0].clientX;
  if (Math.abs(d) > 50) lbStep(d > 0 ? 1 : -1);
}, { passive: true });

/* ── CHIPS ── */
let curCat = 'all';

function showCat(cat, btn) {
  curCat = cat;
  document.querySelectorAll('.wcat-btn').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  renderChips();
}

function renderChips() {
  const ch = document.getElementById('wchips');
  if (!ch) return;
  const chips = PaizEngine.ALL_CHIPS[curCat] || PaizEngine.ALL_CHIPS.all;
  const isImg = curCat === 'images' || curCat === 'isc_img';
  const isNis = curCat === 'nis';
  ch.innerHTML = chips.map(c =>
    `<button class="chip${isImg ? ' img-chip' : ''}${isNis ? ' nis-chip' : ''}" onclick="useChip(this)">${c}</button>`
  ).join('');
}

/* ══════════════════════════════════════════════
   FIX 4: buildWelcomeEl() — single source of truth
   Used by both initial render and clearChat()
══════════════════════════════════════════════ */
function buildWelcomeEl() {
  const w = document.createElement('div');
  w.className = 'welcome';
  w.id = 'welcome';
  w.innerHTML = `
    <div class="wlogo">p</div>
    <div class="wnew"><span class="wnew-dot"></span>v5.3 — OMNISCIENT · NIS + FN SMP</div>
    <div class="wtitle">I am p<em>AI</em>z. I know everything.</div>
    <p class="wsub">The LoL · Paiz® Corp · ISC · Freaky Niggas · FN SMP · Government · Legal · TLSRL · Citizenship — all indexed. Use <kbd>/</kbd> commands or just ask naturally. BM & EN.</p>
    <p class="wbm">Taip <strong>/show tlcc</strong> atau <strong>/search fn smp</strong> — aku faham.</p>
    <div class="wcat">
      <button class="wcat-btn on"         onclick="showCat('all',this)">ALL</button>
      <button class="wcat-btn"            onclick="showCat('history',this)">HISTORY</button>
      <button class="wcat-btn"            onclick="showCat('gov',this)">GOVERNMENT</button>
      <button class="wcat-btn"            onclick="showCat('corp',this)">PAIZ CORP</button>
      <button class="wcat-btn"            onclick="showCat('fn',this)">FREAKY NIGGAS</button>
      <button class="wcat-btn"            onclick="showCat('fnsmp',this)">⛏ FN SMP</button>
      <button class="wcat-btn nis-cat"    onclick="showCat('nis',this)">🪪 NIS</button>
      <button class="wcat-btn img-cat"    onclick="showCat('images',this)">📷 PHOTOS</button>
      <button class="wcat-btn img-cat"    onclick="showCat('isc_img',this)">🔒 ISC FILES</button>
    </div>
    <div class="wchips" id="wchips"></div>
    <div class="cmd-hint-bar">
      <span class="cmd-hint">
        <kbd>/search</kbd> · <kbd>/show</kbd> · <kbd>/gov</kbd> · <kbd>/isc</kbd> · <kbd>/nis</kbd> · <kbd>/fn</kbd> · <kbd>/fnsmp</kbd> · <kbd>/clear</kbd> · <kbd>/theme</kbd> · <kbd>/help</kbd>
      </span>
    </div>`;
  return w;
}

/* Initial render */
(function initWelcome() {
  const mi = document.getElementById('mi');
  mi.appendChild(buildWelcomeEl());
  curCat = 'all';
  renderChips();
})();

/* ── DOM REFS ── */
const mw              = document.getElementById('mw');
const mi              = document.getElementById('mi');
const ci              = document.getElementById('ci');
const cs              = document.getElementById('cs');
const langFlag        = document.getElementById('langFlag');
const searchIndicator = document.getElementById('searchIndicator');
let   busy            = false;

/* ── CONTEXT MEMORY ── */
let lastContext = null;

/* ── HELPERS ── */
function ts()  { return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function bot() { mw.scrollTo({ top: mw.scrollHeight, behavior: 'smooth' }); }

function addUser(t) {
  const w = document.getElementById('welcome');
  if (w) w.remove();
  const g = document.createElement('div');
  g.className = 'mg';
  g.innerHTML = `<div class="mu">${t.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><div class="mtime" style="text-align:right">${ts()}</div>`;
  mi.appendChild(g);
  bot();
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'typing-row';
  el.id = 'typ';
  el.innerHTML = `<div class="mb-av">p</div><div class="typing-bub"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  mi.appendChild(el);
  bot();
}

function addBot(html, fups, extra = '') {
  const el = document.getElementById('typ');
  if (el) el.remove();
  const g   = document.createElement('div');
  g.className = 'mg';
  const row = document.createElement('div');
  row.className = 'mb-row';
  row.innerHTML = `<div class="mb-av">p</div><div class="mb-txt">${html}${extra}</div>`;
  const time = document.createElement('div');
  time.className  = 'mtime bot';
  time.textContent = `pAIz · ${ts()}`;
  g.appendChild(row);
  g.appendChild(time);
  if (fups && fups.length) {
    const fu = document.createElement('div');
    fu.className = 'fups';
    fups.forEach(f => {
      const b = document.createElement('button');
      b.className = 'fup';
      b.textContent = f;
      b.onclick = () => processQuery(f);
      fu.appendChild(b);
    });
    g.appendChild(fu);
  }
  mi.appendChild(g);
  bot();
}

function renderPortalResults(results, bm) {
  if (!results.length) return bm ? 'Tiada hasil ditemui.' : 'No results found.';
  const header = bm
    ? `<strong>Hasil Carian (${results.length} portal):</strong>`
    : `<strong>Search Results (${results.length} portals):</strong>`;
  const items = results.map(p =>
    `<a href="${p.url}" class="sr-item" target="_blank" rel="noopener">
      <div class="sr-left">
        <span class="sr-tag">${p.tag}</span>
        <span class="sr-name">${p.name}</span>
        <span class="sr-desc">${p.desc}</span>
      </div>
      <span class="sr-arrow">→</span>
    </a>`
  ).join('');
  return `${header}<div class="search-results">${items}</div>`;
}

/* ══════════════════════════════════════════════════════════
   PROCESS QUERY
══════════════════════════════════════════════════════════ */
async function processQuery(t) {
  if (busy || !t.trim()) return;
  const raw = t.trim();

  if (/^\/clear$/i.test(raw)) { clearChat(); return; }
  if (/^\/theme$/i.test(raw)) { toggleTheme(); return; }

  busy = true;
  cs.disabled = true;
  ci.value = '';
  ci.style.height = 'auto';

  const bm = PaizEngine.detectBM(raw);
  langFlag.textContent = bm ? 'BM' : 'EN';
  langFlag.className   = 'lang-flag' + (bm ? ' bm' : '');

  addUser(raw);
  addTyping();
  await new Promise(r => setTimeout(r, 350 + Math.random() * 400));

  const lower = raw.toLowerCase();

  /* ── SLASH COMMANDS ── */
  if (raw.startsWith('/')) {
    const parts = raw.slice(1).split(/\s+/);
    const cmd   = parts[0].toLowerCase();
    const arg   = parts.slice(1).join(' ').trim();

    /* FIX 3: Added nis: 'nis_overview' to kbMap */
    const kbMap = {
      gov:   'government',
      isc:   'isc',
      fn:    'fn_about',
      help:  'help',
      fnsmp: 'fnsmp_about',
      nis:   'nis_overview',   // ← NEW
    };

    if (kbMap[cmd]) {
      const e = PaizEngine.KB.find(x => x.id === kbMap[cmd]);
      if (e) { addBot(e.r(bm), e.fup || []); lastContext = e; }
      else   { addBot(PaizEngine.fallback(bm), []); }
      busy = false; cs.disabled = false; ci.focus(); return;
    }

    if (cmd === 'search') {
      const q = arg || (bm ? 'kerajaan' : 'government');
      searchIndicator.classList.add('show');
      const portalResults = PaizEngine.searchPortals(q);
      const kbResults     = PaizEngine.searchAllKB(q);
      let html = bm
        ? `<strong>🔍 Mencari: "${q}"</strong><br><br>`
        : `<strong>🔍 Searching: "${q}"</strong><br><br>`;
      if (kbResults.length) {
        html += `<em style="font-size:.8rem;color:var(--faint)">${bm ? 'Daripada KB pAIz:' : 'From pAIz KB:'}</em><br>`;
        const first = kbResults[0];
        if (first.type === 'image') html += `${first.entry.r(bm)}<br>${PaizEngine.imgGrid(first.entry.images.slice(0, 3), first.entry.era)}<br>`;
        else html += `${first.entry.r(bm)}<br><br>`;
      }
      if (portalResults.length) html += renderPortalResults(portalResults, bm);
      if (!kbResults.length && !portalResults.length) html += PaizEngine.fallback(bm);
      addBot(html, bm
        ? ['/search fn smp', '/search government', '/search isc', '/search paiz corp']
        : ['/search fn smp', '/search history',    '/search ISC', '/search Paiz Corp']);
      setTimeout(() => searchIndicator.classList.remove('show'), 2000);
      busy = false; cs.disabled = false; ci.focus(); return;
    }

    if (cmd === 'show') {
      const q     = arg || 'neverland';
      const match = PaizEngine.bestMatch(q);
      if (match && match.type === 'image') {
        addBot(match.entry.r(bm), ['Show founding photos', 'Show me the last day', 'Show ISC attack files'],
          PaizEngine.imgGrid(match.entry.images, match.entry.era));
        lastContext = match.entry;
      } else {
        addBot(
          bm ? `Tak jumpa gambar untuk "<em>${q}</em>". Cuba /show neverland atau /show tlcc.`
             : `No images found for "<em>${q}</em>". Try /show neverland or /show tlcc.`,
          ['/show neverland', '/show tlcc', '/show tlsrl', '/show ender dragon']
        );
      }
      busy = false; cs.disabled = false; ci.focus(); return;
    }
  }

  /* ── CONTEXT MEMORY ── */
  if (lower.includes('tell me more') && lastContext) {
    addBot(lastContext.r(bm), lastContext.fup || []);
    busy = false; cs.disabled = false; ci.focus(); return;
  }

  /* ── SEARCH INTENT ── */
  if (PaizEngine.isSearchIntent(lower)) {
    searchIndicator.classList.add('show');
    const q             = lower.replace(/^(search|cari|find|look for|lookup|look up|apa ada pasal|ada tak|seach)\s*/i, '').trim();
    const portalResults = PaizEngine.searchPortals(q);
    const kbResults     = PaizEngine.searchAllKB(q);
    let html = bm
      ? `<strong>🔍 Mencari: "${q}"</strong><br><br>`
      : `<strong>🔍 Searching for: "${q}"</strong><br><br>`;
    if (kbResults.length) {
      html += `<em style="font-size:.8rem;color:var(--faint)">${bm ? 'Jawapan daripada KB pAIz:' : 'From pAIz knowledge base:'}</em><br>`;
      const first = kbResults[0];
      if (first.type === 'image') html += `${first.entry.r(bm)}<br>${PaizEngine.imgGrid(first.entry.images.slice(0, 3), first.entry.era)}<br>`;
      else html += `${first.entry.r(bm)}<br><br>`;
    }
    if (portalResults.length) html += renderPortalResults(portalResults, bm);
    if (!kbResults.length && !portalResults.length) html += PaizEngine.fallback(bm);
    addBot(html, bm
      ? ['search fn smp', 'search government', 'search isc', 'search citizenship']
      : ['search fn smp', 'search history',    'search ISC', 'search citizenship']);
    setTimeout(() => searchIndicator.classList.remove('show'), 2000);

  /* ── SHOW INTENT ── */
  } else if (PaizEngine.isShowIntent(lower)) {
    const stripped = lower.replace(/^(show me|show|tunjuk|gambar|tengok|preview|lihat gambar|foto|photos? of|images? of|pic|pics)\s*/i, '').trim();
    const match    = PaizEngine.bestMatch(stripped);
    if (match && match.type === 'image') {
      addBot(match.entry.r(bm), ['Show founding photos', 'Show me the last day', 'Show ISC attack files'],
        PaizEngine.imgGrid(match.entry.images, match.entry.era));
      lastContext = match.entry;
    } else if (match && match.type === 'text') {
      const imgMatch = PaizEngine.IMG_KB.reduce((best, e) => {
        const s = PaizEngine.scoreEntry(e.kw, stripped);
        return s > best.score ? { entry: e, score: s } : best;
      }, { entry: null, score: 0 });
      if (imgMatch.entry && imgMatch.score > 1) {
        addBot(imgMatch.entry.r(bm), ['Show me more', 'search gallery'],
          PaizEngine.imgGrid(imgMatch.entry.images, imgMatch.entry.era));
      } else {
        addBot(
          bm ? `Tak jumpa gambar untuk "<em>${stripped}</em>". Tapi ni yang aku tahu:`
             : `No photos found for "<em>${stripped}</em>". But here's what I know:`,
          ['Show Neverland', 'Show The LoL City', 'Show TLSRL', 'Show last day']
        );
      }
    } else {
      addBot(
        bm ? `Tak jumpa gambar untuk tu. Cuba <em>/show neverland</em>, <em>/show tlsrl</em>, atau <em>/show tlcc</em>.`
           : `Couldn't find photos for that. Try <em>/show neverland</em>, <em>/show tlsrl</em>, or <em>/show tlcc</em>.`,
        ['/show neverland', '/show The LoL City', '/show TLSRL', '/show ISC files']
      );
    }

  /* ── STANDARD QUERY ── */
  } else {
    const match = PaizEngine.bestMatch(lower);
    if (match) {
      if (match.type === 'image') {
        addBot(match.entry.r(bm), ['Show me more', 'Show founding', 'search everything'],
          PaizEngine.imgGrid(match.entry.images, match.entry.era));
        lastContext = match.entry;
      } else {
        const imgMatch = PaizEngine.IMG_KB.reduce((best, img) => {
          const s = PaizEngine.scoreEntry(img.kw, lower);
          return s > best.score ? { entry: img, score: s } : best;
        }, { entry: null, score: 0 });
        const extra = (imgMatch.entry && imgMatch.score > 6)
          ? PaizEngine.imgGrid(imgMatch.entry.images.slice(0, 2), imgMatch.entry.era)
          : '';
        addBot(match.entry.r(bm), match.entry.fup || [], extra);
        lastContext = match.entry;
      }
    } else {
      addBot(PaizEngine.fallback(bm), bm
        ? ['Sejarah The LoL', 'Kerajaan', 'FN SMP', 'Show me photos']
        : ['History of The LoL', 'Government', 'FN SMP', 'Show me photos']);
    }
  }

  busy = false;
  cs.disabled = false;
  ci.focus();
}

/* ── SEND / CHIP / CLEAR ── */
function sendMsg() { const t = ci.value.trim(); if (t) processQuery(t); }

/* Strip decorative emoji from chip text before querying */
function useChip(b) { processQuery(b.textContent.replace(/[📷⛏🔒🪪]/g, '').trim()); }

/* FIX 4: clearChat uses buildWelcomeEl() — no more duplicated HTML */
function clearChat() {
  mi.innerHTML = '';
  lastContext  = null;
  mi.appendChild(buildWelcomeEl());
  curCat = 'all';
  renderChips();
  langFlag.textContent = 'EN';
  langFlag.className   = 'lang-flag';
  searchIndicator.classList.remove('show');
}

/* ── TEXTAREA AUTO-HEIGHT ── */
function adjustHeight() {
  ci.style.height = 'auto';
  ci.style.height = Math.min(ci.scrollHeight, 180) + 'px';
}

ci.addEventListener('input', adjustHeight);
/* FIX 7: handle paste — recalculate height after paste content is inserted */
ci.addEventListener('paste', () => setTimeout(adjustHeight, 0));

ci.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  if (e.ctrlKey && e.key === 'k')       { e.preventDefault(); ci.focus(); }
});
</script>
